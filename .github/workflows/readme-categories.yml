# Regroupe le tableau du README par catégorie après chaque run Upptime.
# (Fichier perso : non géré par Upptime, donc pas écrasé par update-template.)
name: README categories
on:
  workflow_run:
    workflows: ["Uptime CI", "Summary CI"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.repository }}-readme-categories
  cancel-in-progress: false
jobs:
  group:
    name: Group README by category
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Group table
        run: python3 .github/scripts/group_readme.py
      - name: Commit
        run: |
          if git diff --quiet README.md; then exit 0; fi
          git config user.name "Upptime Bot"
          git config user.email "73812536+upptime-bot@users.noreply.github.com"
          git add README.md
          git commit -m ":card_index_dividers: Group README by category [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "${{ github.event.repository.default_branch }}" && git push && exit 0
            sleep 5
          done
          exit 1
